{% extends "base.html" %}

{% block title %}Sign In | Smart Campus Lost & Found{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">🔐</div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your Smart Campus Lost & Found account</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
      <div class="form-group">
        <label for="email" class="form-label">Campus Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-control" 
          placeholder="student@university.edu" 
          value="{{ email or '' }}" 
          required 
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-control" 
          placeholder="••••••••" 
          required
        >
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        <span>Sign In</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account yet? <a href="{{ url_for('auth.register') }}" class="auth-link">Create Account</a></p>
    </div>
  </div>
</div>
{% endblock %}
