{% extends "base.html" %}

{% block title %}Create Account | Smart Campus Lost & Found{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">✨</div>
      <h1 class="auth-title">Join Smart Campus</h1>
      <p class="auth-subtitle">Create an account to report lost & found items</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          class="form-control" 
          placeholder="Jane Doe" 
          value="{{ name or '' }}" 
          required 
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Campus Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-control" 
          placeholder="jane.doe@university.edu" 
          value="{{ email or '' }}" 
          required
        >
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-control" 
          placeholder="At least 6 characters" 
          required
        >
      </div>

      <div class="form-group">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <input 
          type="password" 
          id="confirm_password" 
          name="confirm_password" 
          class="form-control" 
          placeholder="Re-enter password" 
          required
        >
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        <span>Create Account</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a href="{{ url_for('auth.login') }}" class="auth-link">Sign In</a></p>
    </div>
  </div>
</div>
{% endblock %}
